services:
  postgres:
    image: postgres:16
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: auth_redis
    ports:
      - "6382:6379"
    networks:
      - app_network

  web:
    build:
      context: ./fastapi_auth_project   # Dockerfile is folder ke andar hai
    container_name: fastapi_app
    command: uvicorn app.main:socket_app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi_auth_project:/app     # Code map karo
    env_file:
      - .env                            # Root wali .env uthao
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  celery_worker:
    build:
      context: ./fastapi_auth_project   # Same build context
    container_name: celery_worker
    command: celery -A app.celery_app.celery_worker worker --loglevel=info
    volumes:
      - ./fastapi_auth_project:/app     # Same volume mapping
    env_file:
      - .env                           # Root wali .env uthao
    depends_on:
      - redis
      - postgres
    networks:
      - app_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
    driver: bridge